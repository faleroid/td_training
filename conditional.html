<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const axes = {
            x: 10,
            y: 5
        }

        console.log(axes);

        if (axes.x > 0 && axes.y > 0) {
            console.log('Player on the top right');
        } else if (axes.x < 0 && axes.y > 0) {
            console.log('Player on the top left');
        } else if (axes.x < 0 && axes.y < 0) {
            console.log('Player on the bottom left');
        } else if (axes.x > 0 && axes.y < 0) {
            console.log('Player on the bottom right');
        }
    </script>
</body>
</html>
